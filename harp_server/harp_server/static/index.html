<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HARP Sweeps</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <h1>HARP <span>· generate phase on TAPIS</span></h1>
  <div id="whoami" hidden>
    <span id="who"></span>
    <button class="ghost" id="logout">Log out</button>
  </div>
</header>

<!-- ------------------------------------------------------------ login -->
<main id="login-view" hidden>
  <section class="card narrow">
    <h2>Log in to TAPIS</h2>
    <form id="login-form">
      <label>Tenant URL <input name="base_url" value="https://icicle.tapis.io" required></label>
      <label>Username <input name="username" autocomplete="username"></label>
      <label>Password <input name="password" type="password" autocomplete="current-password"></label>
      <details><summary>Use an access token instead</summary>
        <label>Access token (JWT) <textarea name="access_token" rows="3"></textarea></label>
      </details>
      <button type="submit">Log in</button>
      <p class="error" id="login-error"></p>
    </form>
  </section>
</main>

<!-- ------------------------------------------------------------- app -->
<main id="app-view" hidden>
  <nav class="tabs">
    <button data-tab="new" class="active">New sweep</button>
    <button data-tab="campaigns">Campaigns</button>
  </nav>

  <!-- New sweep -->
  <section id="tab-new">
    <div class="toolbar">
      <button class="ghost" id="load-example">Load Euler example</button>
      <label class="ghost button">Import JSON <input type="file" id="import-spec" accept=".json" hidden></label>
      <button class="ghost" id="export-spec">Export JSON</button>
    </div>

    <div class="card">
      <h2>1 · Application</h2>
      <div class="grid">
        <label>Campaign name <input id="f-name" placeholder="euler-sweep-1"></label>
        <label>Application <input id="f-application" placeholder="euler"></label>
        <label class="wide">Command template
          <input id="f-command" placeholder="python3 calc_e.py {method} {n} {precision}">
          <small>Use {parameter} placeholders. Runs inside the app container.</small></label>
        <label class="wide">Work folder in container <input id="f-workdir" placeholder="/app/01-eulers_number"></label>
        <label>Repetitions per combination <input id="f-repetitions" type="number" min="1" value="3"></label>
        <label>Timeout per run (s) <input id="f-timeout" type="number" min="0" value="600"></label>
        <label>Combinations per TAPIS job <input id="f-combos" type="number" min="1" value="1"></label>
        <label>Distribution
          <select id="f-distribution">
            <option value="split">Split – each job runs once, spread over hardware</option>
            <option value="replicate">Replicate – every job runs on every system</option>
          </select></label>
      </div>
    </div>

    <div class="card">
      <h2>2 · Sweep parameters</h2>
      <p class="hint">One line per parameter: <code>name = v1, v2, v3</code>. Every combination becomes a run.</p>
      <div id="run-sets"></div>
      <button class="ghost" id="add-run-set">+ Add run set</button>
    </div>

    <div class="card">
      <h2>3 · Hardware (TAPIS execution systems)</h2>
      <div id="targets"></div>
      <button class="ghost" id="add-target">+ Add system</button>
    </div>

    <div class="card">
      <h2>4 · Where to store the profiling data</h2>
      <div class="grid">
        <label>Storage system <select id="f-storage-system"></select></label>
        <label class="wide">Folder <input id="f-storage-path" placeholder="/fs/scratch/PAS0000/me/harp_runs"></label>
      </div>
      <button class="ghost" id="browse">Browse…</button>
      <div id="browser" hidden>
        <div class="crumbs" id="browser-path"></div>
        <ul id="browser-list"></ul>
        <div class="row">
          <button id="browser-use">Use this folder</button>
          <button class="ghost" id="browser-mkdir">New folder…</button>
        </div>
      </div>
    </div>

    <div class="card actions">
      <button class="ghost" id="check">Test access</button>
      <button class="ghost" id="preview">Preview jobs</button>
      <button id="launch">Launch sweep</button>
      <div id="form-output"></div>
    </div>
  </section>

  <!-- Campaigns -->
  <section id="tab-campaigns" hidden>
    <div class="split">
      <ul id="campaign-list" class="card list"></ul>
      <div id="campaign-detail" class="card"><p class="hint">Select a campaign.</p></div>
    </div>
  </section>
</main>

<div id="toast" hidden></div>
<script src="/static/app.js"></script>
</body>
</html>
